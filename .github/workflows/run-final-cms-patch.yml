name: Run final CMS polish patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: final-cms-security-polish-2026-08-22
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/final-cms-patch.py

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalog.ts src/pages/Home.tsx src/components/layout/Navbar.tsx src/pages/Solutions.tsx src/admin/Cms.tsx netlify/functions/sitemap.mjs netlify.toml README.md
          git commit -m "Connect public CMS previews and dynamic SEO" || exit 0
          git push origin HEAD:final-cms-security-polish-2026-08-22
