name: Finalize CMS polish branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: final-cms-security-polish-2026-08-22
          fetch-depth: 0

      - name: Fix resource metadata and remove temporary patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Home.tsx')
          text = p.read_text(encoding='utf-8')
          old = '<span className="text-ink-400">{r.minutes}</span>'
          new = '<span className="text-ink-400">{r.meta}</span>'
          if old not in text:
              raise SystemExit('Home resource metadata marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-final-cms-polish.yml .github/.cms-polish-trigger scripts/final-cms-patch.py

      - name: Commit target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize CMS polish changes"
          git push origin HEAD:final-cms-security-polish-2026-08-22
