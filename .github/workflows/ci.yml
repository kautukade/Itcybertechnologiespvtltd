name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Security, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository security regression checks
        run: node scripts/security-check.mjs

      - name: Validate Netlify sitemap function
        run: node --check netlify/functions/sitemap.mjs

      - name: Validate Netlify environment preflight
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-public-key
        run: node scripts/validate-netlify-env.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

  edge-functions:
    name: Validate Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: |
          deno check --config supabase/functions/deno.json --no-lock \
            supabase/functions/submit-contact/index.ts \
            supabase/functions/submit-assessment/index.ts \
            supabase/functions/submit-career/index.ts \
            supabase/functions/prepare-resume-upload/index.ts
