name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  edge-functions:
    name: Validate Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Supabase Edge Functions are Deno code using `npm:` specifiers.
      # The repo-root package.json would otherwise switch Deno into
      # node_modules resolution (BYONM) and fail with "Could not find
      # @supabase/supabase-js in a node_modules folder". The config at
      # supabase/functions/deno.json sets "nodeModulesDir": "none" so npm
      # dependencies resolve through the Deno cache instead — no npm install
      # needed in this job.
      - name: Typecheck Edge Functions
        run: |
          deno check --no-lock \
            supabase/functions/submit-contact/index.ts \
            supabase/functions/submit-assessment/index.ts \
            supabase/functions/submit-career/index.ts
