name: Post-deploy smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify Netlify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Wait briefly for Netlify deploy
        run: sleep 20

      - name: Verify production site
        env:
          SITE_URL: https://itcybertechnologies.netlify.app
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_MS: "15000"
        run: node scripts/smoke-test.mjs
