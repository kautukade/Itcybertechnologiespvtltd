name: Post-deploy smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify Netlify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Wait briefly for Netlify deploy
        run: sleep 20

      - name: Verify production site
        env:
          SITE_URL: https://itcybertechnologies.netlify.app
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_MS: "15000"
        run: node scripts/smoke-test.mjs
