        Your details are safely stored and a real engineer reviews every submission. We'll reply to <strong className="text-ink-800">{email}</strong> as soon as it's read.''', '''        Thanks, {name.split(" ")[0]} — your details are stored securely and reviewed by a real engineer. We'll reply to <strong className="text-ink-800">{email}</strong> as soon as it's read.''')

          replace('src/components/layout/Navbar.tsx', '''  /* keyboard: Escape closes menus; focus moves into the mobile sheet */
  const closeRef = useRef<HTMLButtonElement>(null);
  useEffect(() => {
    if (!mobileOpen) return;
    const onKey = (e: KeyboardEvent) => e.key === "Escape" && setMobileOpen(false);
    document.addEventListener("keydown", onKey);
    closeRef.current?.focus();
    return () => document.removeEventListener("keydown", onKey);
  }, [mobileOpen]);''', '''  /* keyboard: trap focus inside the mobile sheet, Escape closes, focus returns to trigger */
  const closeRef = useRef<HTMLButtonElement>(null);
  const menuButtonRef = useRef<HTMLButtonElement>(null);
  const mobileDialogRef = useRef<HTMLDivElement>(null);

  useEffect(() => {
    if (mobileDialogRef.current) mobileDialogRef.current.inert = !mobileOpen;
  }, [mobileOpen]);

  useEffect(() => {
    if (!mobileOpen) return;
    const previouslyFocused = document.activeElement instanceof HTMLElement ? document.activeElement : menuButtonRef.current;
    const onKey = (e: KeyboardEvent) => {
      if (e.key === "Escape") {
        e.preventDefault();
        setMobileOpen(false);
        return;
      }
      if (e.key !== "Tab" || !mobileDialogRef.current) return;
      const focusable = Array.from(mobileDialogRef.current.querySelectorAll<HTMLElement>('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')).filter((el) => el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    };
    document.addEventListener("keydown", onKey);
    closeRef.current?.focus();
    return () => {
      document.removeEventListener("keydown", onKey);
      queueMicrotask(() => previouslyFocused?.focus());
    };
  }, [mobileOpen]);''')
