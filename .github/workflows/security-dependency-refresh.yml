name: Security dependency refresh

on:
  push:
    branches: [security-hardening-2026-08-22-v2]

permissions:
  contents: write

jobs:
  refresh:
    # Single guarded run used by this hardening PR to regenerate package files.
    if: github.event.head_commit.message == 'Run dependency refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security-hardening-2026-08-22-v2

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade vulnerable router and remove unused uuid
        run: |
          npm install react-router-dom@7.18.2 --save-exact
          npm uninstall uuid @types/uuid

      - name: Verify security and build
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm run typecheck
          npm run build

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade security-sensitive dependencies [deps-generated]"
          git push origin HEAD:security-hardening-2026-08-22-v2
